version: 2

models:
    - name: customers_statut
      description: Customer data with basic cleaning and transformation applied, one row per customer.
      columns:
        - name: id
          description: The unique key for each customer.
          tests:
            - not_null
            - unique
        - name: statut
          description: catégories.
          tests:
            - not_null
          name: date
          description: date ou le client a été catégorisé
          tests:
            - not_null